# Base stack: app + PostgreSQL + inner nginx (page cache, /media/).
#
# On the server it is never used alone. Each environment adds its override file and runs as its own
# Compose project behind the shared edge proxy (deploy/edge/), always through the wrapper:
#   deploy/dc.sh prod    <compose args>   # = -p lumiere         -f docker-compose.yml -f deploy/compose.prod.yml
#   deploy/dc.sh staging <compose args>   # = -p lumiere-staging -f docker-compose.yml -f deploy/compose.staging.yml
# See DEPLOY.md. Running this file alone (local testing only) publishes the inner nginx on port 80.
services:
  app:
    # Each environment builds its own image (SITE_URL is baked in at build time); deploy/release.sh sets
    # APP_IMAGE to lumiere-app:<env>-<commit> so a rollback is "start the previous tag".
    image: ${APP_IMAGE:-lumiere-app:local}
    build: { context: ., args: { REGISTRY: '${REGISTRY:-}', SITE_URL: '${SITE_URL}' } }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lumiere:${POSTGRES_PASSWORD}@db:5432/lumiere
      MEDIA_DIR: /media
    volumes: [media:/media]
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 512m

  db:
    image: ${REGISTRY:-}postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumiere
    # Tuned for ~1 GB of the server's RAM.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB
               -c maintenance_work_mem=64MB -c max_connections=40 -c wal_compression=on
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U lumiere'], interval: 5s, retries: 10 }
    mem_limit: 1g

  nginx:
    image: ${REGISTRY:-}nginx:1.27-alpine
    restart: unless-stopped
    # Local testing only. On the server the environment override removes this (ports: !reset []):
    # only the edge proxy publishes ports.
    ports: ['80:80']
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/proxy_params_lumiere:/etc/nginx/proxy_params_lumiere:ro
      # nocopy: never seed the photo volume from the nginx image's own /media folder (Alpine ships
      # cdrom/floppy/usb there). The app image creates the volume, owned by the "node" user.
      - { type: volume, source: media, target: /media, read_only: true, volume: { nocopy: true } }
      - nginxcache:/var/cache/nginx
    depends_on: [app]
    mem_limit: 128m

volumes:
  pgdata:
  media:
  nginxcache:

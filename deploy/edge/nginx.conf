# Edge proxy. Port 80: ACME challenges + redirect to HTTPS. Port 443: one server block per environment,
# enabled from deploy/edge/sites/ into deploy/edge/enabled/ by site.sh once its certificate exists
# (so the edge can start, and certbot can validate, before any certificate is issued).
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 12m;   # product photos up to 10 MB pass through here

  # Docker's DNS. Upstreams are resolved per request (see snippets/proxy-to-stack.conf), so the edge
  # starts and keeps serving the other environment even when one stack is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ---- Domains served by this edge. To change a domain, edit it here, in sites/*.conf, and in the
  # ---- certbot commands in DEPLOY.md.

  # Port 80 for known hosts: certbot webroot challenges stay on HTTP; everything else goes to HTTPS.
  server {
    listen 80;
    server_name oojashop.ir www.oojashop.ir staging.oojashop.ir;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Anything else (bare IP, unknown Host): drop the connection.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  # Unknown TLS server names: refuse the handshake instead of presenting a certificate.
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  include /etc/nginx/enabled/*.conf;
}

# Proxy to an environment's inner nginx. The caller sets $upstream first, e.g.
#   set $upstream http://lumiere-prod-nginx:80;
# Using a variable makes nginx resolve the name per request (via the resolver in nginx.conf), so a stopped
# stack gives a 502 for that site instead of stopping the whole edge from starting.
proxy_pass $upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
# Fixed values set here, never taken from the client: the inner nginx trusts X-Real-IP from the edge
# network only, and the app's form origin check relies on X-Forwarded-Proto/Host.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Basic-auth credentials stay at the edge.
proxy_set_header Authorization "";
proxy_read_timeout 60s;
proxy_send_timeout 60s;

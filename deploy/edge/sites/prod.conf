# Production: oojashop.ir (canonical) and www.oojashop.ir (redirects to it).
# Certificate: certbot --cert-name oojashop.ir -d oojashop.ir -d www.oojashop.ir (see DEPLOY.md).
# Enable with: sh deploy/edge/site.sh enable prod

server {
  listen 443 ssl;
  http2 on;
  server_name www.oojashop.ir;
  ssl_certificate     /etc/letsencrypt/live/oojashop.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/oojashop.ir/privkey.pem;
  include /etc/nginx/snippets/security-headers.conf;
  return 301 https://oojashop.ir$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name oojashop.ir;
  ssl_certificate     /etc/letsencrypt/live/oojashop.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/oojashop.ir/privkey.pem;
  include /etc/nginx/snippets/security-headers.conf;

  # Pre-launch lock: deploy/edge/state/prod-auth.conf exists = basic auth on (sh deploy/edge/prod-auth.sh on|off).
  # Removing it is the launch. The glob makes a missing file mean "open".
  include /etc/nginx/state/prod-auth*.conf;

  location / {
    set $upstream http://lumiere-prod-nginx:80;
    include /etc/nginx/snippets/proxy-to-stack.conf;
  }
}

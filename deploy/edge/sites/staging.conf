# Staging: staging.oojashop.ir. Always behind basic auth and marked noindex.
# Certificate: certbot --cert-name staging.oojashop.ir -d staging.oojashop.ir (see DEPLOY.md).
# Enable with: sh deploy/edge/site.sh enable staging (needs deploy/edge/auth/staging.htpasswd first).

server {
  listen 443 ssl;
  http2 on;
  server_name staging.oojashop.ir;
  ssl_certificate     /etc/letsencrypt/live/staging.oojashop.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.oojashop.ir/privkey.pem;
  include /etc/nginx/snippets/security-headers.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;

  auth_basic "OOJA SHOP staging";
  auth_basic_user_file /etc/nginx/auth/staging.htpasswd;

  # Crawlers that ignore the auth wall still get told to stay away.
  location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    set $upstream http://lumiere-staging-nginx:80;
    include /etc/nginx/snippets/proxy-to-stack.conf;
  }
}

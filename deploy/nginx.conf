# Inner nginx of one environment (production or staging). Plain HTTP: TLS, HSTS, basic auth and
# HTTP->HTTPS redirects all happen at the shared edge proxy (deploy/edge/), the only container that
# publishes ports. This nginx keeps the page cache, serves /media/ and rate-limits /api/.
worker_processes auto;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 12m;

  # Real client IP. Requests arrive from the edge proxy over the "edge" Docker network, created with the
  # fixed subnet below (DEPLOY.md, first-time setup). Only that subnet is trusted to set X-Real-IP, so
  # $remote_addr becomes the visitor's IP for the /api/ rate limit, the logs and the app's own limiters.
  # If you create the edge network with another subnet, change this line to match.
  set_real_ip_from 172.31.250.0/24;
  real_ip_header X-Real-IP;

  # The edge terminates TLS and sends X-Forwarded-Proto: https. Pass it on to the app (its form origin
  # check needs the public scheme); fall back to this hop's scheme for direct local testing.
  map $http_x_forwarded_proto $lumiere_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Public HTML is cached for the time the app sets in X-Accel-Expires (60 s), so most visits never reach Node.
  # stale-if-error keeps the shop online for readers if the app restarts.
  proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=500m inactive=1h use_temp_path=off;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  upstream app { server app:4321; keepalive 16; }

  server {
    listen 80;
    server_name _;

    location /media/ {
      alias /media/;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location /_astro/ {
      proxy_pass http://app;
      proxy_cache pages;
      proxy_cache_valid 200 30d;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params_lumiere;
    }

    location / {
      proxy_pass http://app;
      proxy_cache pages;
      proxy_cache_key $scheme$host$request_uri;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache $upstream_cache_status;
      include /etc/nginx/proxy_params_lumiere;
    }
  }
}

# Local development database only. Run: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere
      POSTGRES_DB: lumiere
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
